<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Profissional ERP</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --primary: #00994d; /* Verde igual ao da imagem 01-1.jpg */
            --primary-hover: #007a3d;
            --dark-menu: #23272b; /* Fundo escuro do menu lateral */
            --background: #f4f6f9;
            --surface: #ffffff;
            --text: #333333;
            --border: #dee2e6;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--background); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* MENU LATERAL (Inspirado na imagem 01-1.jpg) */
        .sidebar { background: var(--dark-menu); width: 65px; display: flex; flex-direction: column; align-items: center; padding-top: 15px; gap: 20px; }
        .sidebar-btn { background: none; border: none; color: #a2a3a5; font-size: 22px; cursor: pointer; width: 100%; padding: 12px 0; transition: 0.2s; text-align: center; }
        .sidebar-btn:hover, .sidebar-btn.active { color: #fff; background: rgba(255,255,255,0.05); border-left: 4px solid var(--primary); }

        /* ÁREA PRINCIPAL */
        .main-layout { flex: 1; display: flex; flex-direction: column; }

        /* BARRA SUPERIOR VERDE */
        .topbar { background: var(--primary); color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .topbar-brand { font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .topbar-menu { display: flex; gap: 20px; align-items: center; }
        .topbar-link { color: white; text-decoration: none; font-weight: 600; cursor: pointer; }

        /* CONTEÚDO DO PDV (Divisão Esquerda e Direita) */
        .workspace { flex: 1; display: flex; padding: 15px; gap: 15px; overflow: hidden; }
        
        /* PAINEL DA ESQUERDA (CUPOM E PAGAMENTO) */
        .left-panel { width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; display: flex; flex-direction: column; padding: 15px; }
        
        /* PAINEL DA DIREITA (GRADE DE PRODUTOS) */
        .right-panel { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; display: flex; flex-direction: column; padding: 15px; }

        /* SELEÇÃO DE CLIENTE E PESQUISA POR CÓDIGO BARRAS / TECLADO */
        .search-box { background: #f8f9fa; border: 1px solid var(--border); padding: 5px 10px; border-radius: 4px; font-size: 14px; width: 100%; outline: none; margin-top: 8px; }
        .search-box:focus { border-color: var(--primary); }

        /* TABELA DE ITENS LANCADOS */
        .table-container { flex: 1; overflow-y: auto; margin-top: 15px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 8px; border-bottom: 1px solid var(--border); }
        th { background: #e9ecef; font-weight: 600; }

        /* CAIXA DE TOTAIS E VALORES (Igual imagem 01-1.jpg) */
        .summary-box { background: #eef2f7; padding: 12px; border-radius: 4px; margin-top: 15px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
        .summary-row { display: flex; justify-content: space-between; }
        .total-row { font-size: 18px; font-weight: bold; color: #111; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px; }

        /* BOTÕES DE AÇÃO INFERIORES */
        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
        .btn { border: none; padding: 12px; font-weight: bold; color: white; border-radius: 4px; cursor: pointer; font-size: 13px; text-align: center; }
        .btn-orange { background: #ff9800; }
        .btn-purple { background: #673ab7; }
        .btn-red { background: #e53935; }
        .btn-blue { background: #1e88e5; }
        .btn-green { background: var(--primary); grid-column: span 2; font-size: 16px; padding: 15px; }

        /* GRADE DE PRODUTOS COM FOTO GOURMET */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; overflow-y: auto; margin-top: 15px; }
        .product-card { border: 1px solid var(--border); border-radius: 4px; overflow: hidden; text-align: center; background: #fff; cursor: pointer; transition: 0.2s; position: relative; }
        .product-card:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .product-img { width: 100%; height: 95px; object-fit: cover; background: #fafafa; }
        .product-info { padding: 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; color: #444; }
        .product-price { color: var(--primary); font-weight: bold; font-size: 13px; margin-top: 4px; }
    </style>
</head>
<body>

    <!-- MENU LATERAL (PADRÃO 01-1.jpg) -->
    <div class="sidebar">
        <button class="sidebar-btn active" title="PDV Balcão">🛒</button>
        <button class="sidebar-btn" title="Mesas e Comandas">📋</button>
        <button class="sidebar-btn" title="Cozinha KDS">👨‍🍳</button>
        <button class="sidebar-btn" title="Controle de Estoque">📦</button>
        <button class="sidebar-btn" title="Financeiro & DRE">💰</button>
        <button class="sidebar-btn" title="Configurações">⚙️</button>
    </div>

    <!-- CORPO CENTRAL -->
    <div class="main-layout">
        
        <!-- BARRA SUPERIOR VERDE -->
        <div class="topbar">
            <div class="topbar-brand">💻 PDV MULTILOJA v2.0</div>
            <div id="clock" style="font-weight: 600;">01/06/2026 16:42:00</div>
            <div class="topbar-menu">
                <span class="topbar-link">📊 Histórico de Vendas</span>
                <span class="topbar-link">🔑 Fechar Caixa</span>
                <span style="display:flex; align-items:center; gap:5px; font-weight:600;">👤 Funcionário Teste</span>
            </div>
        </div>

        <!-- ESPAÇO DE TRABALHO -->
        <div class="workspace">
            
            <!-- PAINEL DA ESQUERDA: LISTA DA COMPRA ATUAL -->
            <div class="left-panel">
                <select class="search-box" style="font-weight: bold;">
                    <option>Cliente Padrão</option>
                </select>
                <!-- Input Inteligente: Aceita Teclado, Código de Barras ou Leitor QR Code -->
                <input type="text" class="search-box" id="barcode-input" placeholder="Procure o produto pelo código, nome ou código de barras..." autofocus>
                
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Produto</th>
                                <th style="text-align:right;">Preço</th>
                                <th style="text-align:center;">Qtd</th>
                                <th style="text-align:right;">Subtotal</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="cart-rows">
                            <!-- Inserção via JavaScript dinâmico -->
                        </tbody>
                    </table>
                </div>

                <!-- TOTAIS IGUAL DA IMAGEM EXPLICATIVA -->
                <div class="summary-box">
                    <div class="summary-row"><span>Total de Itens</span><span id="txt-qtd-itens">0 (0.00)</span><span>Total</span><span id="txt-subtotal">R$ 0.00</span></div>
                    <div class="summary-row"><span>Desconto</span><span id="txt-desconto">(0.00) 0.00</span><span>Taxa / Gorjeta</span><span id="txt-taxa">0.00</span></div>
                    <div class="summary-row total-row"><span>Total a Pagar</span><span id="txt-total-pagar">R$ 0.00</span></div>
                </div>

                <!-- ACÕES DO TECLADO / CLIQUE -->
                <div class="action-grid">
                    <button class="btn btn-orange" onclick="alert('Venda em espera (Aguardar)')">Aguardar</button>
                    <button class="btn btn-purple" onclick="alert('Ver Itens / Descontos')">Ver Itens</button>
                    <button class="btn btn-red" onclick="limparCarrinhoCompleto()">Cancelar</button>
                    <button class="btn btn-blue" onclick="alert('Ver Fatura Atual')">Ver Fatura</button>
                    <button class="btn btn-green" onclick="abrirModalPagamento()">💸 Ir para o Pagamento</button>
                </div>
            </div>

            <!-- PAINEL DA DIREITA: CARDÁPIO COM IMAGENS -->
            <div class="right-panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2 style="font-size: 16px; font-weight: bold; color:#555;">💥 Cardápio Rápido de Frente de Loja</h2>
                </div>
                
                <div class="products-grid" id="menu-produtos-grid">
                    <!-- Gerado dinamicamente com fotos reais igual imagem 01-1.jpg -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // Registro do Service Worker (Ativa o funcionamento PWA Offline)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').then(() => console.log("PWA Ativo Offline!"));
        }

        // Variáveis globais do carrinho
        let carrinho = [];
        const API_URL = `${window.location.origin}/api`;

        // Mock de produtos simulando exatamente a imagem do usuário (01-1.jpg)
        const produtosExemplo = [
            { id: 101, nome: "BATATA FRITA TRADICIONAL", preco: 15.00, img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=200" },
            { id: 102, nome: "HAMBURGUER KISS GOURMET", preco: 26.40, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200" },
            { id: 103, nome: "ÁGUA MINERAL 500ML", preco: 3.30, img: "https://images.unsplash.com/photo-1608885898957-a599fb1b4641?w=200" },
            { id: 104, nome: "SCHWEPPES CITRUS LATA", preco: 5.50, img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=200" },
            { id: 105, nome: "PIZZA BROTINHO PEPPERONI", preco: 35.20, img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=200" }
        ];

        function renderizarCardapio() {
            const grid = document.getElementById('menu-produtos-grid');
            grid.innerHTML = '';
            produtosExemplo.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card" onclick="adicionarAoCarrinho(${p.id})">
                        <img class="product-img" src="${p.img}">
                        <div class="product-info">
                            <div>${p.nome}</div>
                            <div class="product-price">R$ ${p.preco.toFixed(2)}</div>
                        </div>
                    </div>
                `;
            });
        }

        function adicionarAoCarrinho(id) {
            const prod = produtosExemplo.find(p => p.id === id);
            const itemExistente = carrinho.find(i => i.id === id);
            if (itemExistente) {
                itemExistente.qtd++;
                itemExistente.subtotal = itemExistente.qtd * itemExistente.preco;
            } else {
                carrinho.push({ id: prod.id, nome: prod.nome, preco: prod.preco, qtd: 1, subtotal: prod.preco });
            }
            atualizarInterfaceCarrinho();
        }

        function atualizarInterfaceCarrinho() {
            const tbody = document.getElementById('cart-rows');
            tbody.innerHTML = '';
            let total = 0;
            let totalItens = 0;

            carrinho.forEach((item, index) => {
                total += item.subtotal;
                totalItens += item.qtd;
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:600; color: #ff9800;">${item.nome}</td>
                        <td style="text-align:right;">R$ ${item.preco.toFixed(2)}</td>
                        <td style="text-align:center;"><input type="number" value="${item.qtd}" style="width:40px; text-align:center;" onchange="mudarQtd(${index}, this.value)"></td>
                        <td style="text-align:right; font-weight:700;">R$ ${item.subtotal.toFixed(2)}</td>
                        <td style="color:red; cursor:pointer; font-weight:bold;" onclick="removerItem(${index})">❌</td>
                    </tr>
                `;
            });

            document.getElementById('txt-qtd-itens').innerText = `${carrinho.length} (${totalItens.toFixed(2)})`;
            document.getElementById('txt-subtotal').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('txt-total-pagar').innerText = `R$ ${total.toFixed(2)}`;
        }

        function mudarQtd(index, valor) {
            if(valor <= 0) return removerItem(index);
            carrinho[index].qtd = parseInt(valor);
            carrinho[index].subtotal = carrinho[index].qtd * carrinho[index].preco;
            atualizarInterfaceCarrinho();
        }

        function removerItem(index) {
            carrinho.splice(index, 1);
            atualizarInterfaceCarrinho();
        }

        function limparCarrinhoCompleto() {
            carrinho = [];
            atualizarInterfaceCarrinho();
        }

        // Atalhos de Teclado Rápidos para Operador de Caixa Profissional
        window.addEventListener('keydown', (e) => {
            if (e.key === 'F9') { // F9 vai direto para fechar venda
                e.preventDefault();
                abrirModalPagamento();
            }
            if (e.key === 'Escape') { // ESC cancela a operação corrente
                limparCarrinhoCompleto();
            }
        });

        // Loop de Relógio Comercial
        setInterval(() => {
            const data = new Date();
            document.getElementById('clock').innerText = data.toLocaleDateString('pt-BR') + ' ' + data.toLocaleTimeString('pt-BR');
        }, 1000);

        window.onload = () => {
            renderizarCardapio();
        };
    </script>
</body>
</html>
